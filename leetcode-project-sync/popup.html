<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LeetCode Progress Sync</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0e17;
      color: #e9eefb;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px;
    }
    p {
      font-size: 12px;
      color: #93a0b8;
      line-height: 1.5;
      margin: 0 0 12px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #10151f;
      border: 1px solid #212939;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e9eefb;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #22d3ee 100%);
      border: none;
      border-radius: 6px;
      padding: 9px;
      color: #04121a;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 11.5px;
      color: #93a0b8;
    }
    #status.active { color: #34d399; }
    #status.saved { color: #22d3ee; }
  </style>
</head>
<body>
  <h1>LeetCode Progress Sync</h1>
  <p>
    Paste the sync token from your app's Account page. This tells the extension
    which account to sync your LeetCode session to.
  </p>
  <input type="text" id="tokenInput" placeholder="Paste sync token here" autocomplete="off" />
  <button id="saveBtn">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
